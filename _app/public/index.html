<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="description" content="Compare local electricians, plumbers, repair technicians and tutors across Greater Noida.">
  <meta name="robots" content="noindex, nofollow">
  <title>Local Service Finder | Good help, close to home</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=2">
  <script type="module" src="/app.js?v=2"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-shell" id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <template id="home">
    <header class="header">
      <div class="frame header-inner">
        <a class="brand" href="/" aria-label="Local Service Finder home"></a>
        <button class="icon-button menu-button" type="button" data-action="menu" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu" data-icon="menu"></button>
        <nav id="site-nav" aria-label="Main navigation">
          <a href="/#services">Services</a><a href="/#how">How it works</a><button class="nav-text" type="button" data-action="track">Track a request</button>
        </nav>
        <div class="header-actions">
          <button class="location-button" type="button" data-action="location"><span data-icon="pin"></span><span id="header-location">Greater Noida, UP</span><span data-icon="chevron"></span></button>
          <button class="button primary header-cta" type="button" data-action="browse">Find a provider</button>
        </div>
      </div>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <picture class="hero-photo">
          <source media="(max-width: 740px)" srcset="/assets/hero-small.webp">
          <img src="/assets/hero.webp" srcset="/assets/hero-small.webp 1400w, /assets/hero.webp 3840w" sizes="100vw" alt="A tradesperson fitting a pendant light at home" fetchpriority="high">
        </picture>
        <div class="frame hero-inner">
          <div class="hero-copy">
            <p class="eyebrow hero-eyebrow"><span></span> HOME SERVICES IN GREATER NOIDA</p>
            <h1 id="hero-title">Good help,<br><em>close to home.</em></h1>
            <p class="hero-description">Find electricians, plumbers, repair technicians and tutors in your neighbourhood. Compare prices and request a visit.</p>
            <form id="hero-search" class="hero-search" aria-label="Find local services">
              <label class="hero-field"><span class="field-icon" data-icon="tool"></span><span><span class="field-caption">Service</span><select id="hero-category" name="category" aria-label="Choose a service"></select></span><span class="select-chevron" data-icon="chevron"></span></label>
              <label class="hero-field"><span class="field-icon" data-icon="pin"></span><span><span class="field-caption">Locality</span><select id="hero-locality" name="locality" aria-label="Choose a locality"></select></span><span class="select-chevron" data-icon="chevron"></span></label>
              <button class="button primary" type="submit"><span data-icon="search"></span> Search</button>
            </form>
            <div class="popular" aria-label="Popular searches"><span>Popular</span><button data-category="electrician">Electrical</button><button data-category="plumber">Plumbing</button><button data-category="repair">Appliance repair</button></div>
          </div>
          <div class="hero-caption"><span class="caption-icon" data-icon="pin"></span><span><strong>Greater Noida</strong><small>Serving 7 neighbourhoods</small></span></div>
        </div>
      </section>
      <section id="services" class="section frame">
        <div class="section-heading"><div><p class="eyebrow">BROWSE SERVICES</p><h2>What do you need help with?</h2></div><button class="button outline" type="button" data-action="browse">View all providers</button></div>
        <div id="categories" class="category-grid"></div>
      </section>
      <section id="directory" class="section directory">
        <div class="frame">
          <div class="section-heading"><div><p class="eyebrow">SERVICE DIRECTORY</p><h2>Find a local provider</h2><p class="subtle">Compare sample profiles, starting prices and working hours.</p></div><button class="button outline" id="saved-filter" type="button" aria-pressed="false"><span data-icon="bookmark"></span> Saved providers <span id="saved-count" class="count-pill">0</span></button></div>
          <form id="filters" class="filters" aria-label="Filter providers">
            <label class="filter-search"><span class="visually-hidden">Search provider or service</span><span data-icon="search"></span><input name="query" type="search" placeholder="Search providers or services"></label>
            <label><span class="visually-hidden">Service category</span><select name="category"></select></label>
            <label><span class="visually-hidden">Locality</span><select name="locality"></select></label>
            <label><span class="visually-hidden">Sort providers</span><select name="sort"><option value="rating">Top rated</option><option value="price">Lowest price</option><option value="experience">Most experienced</option></select></label>
            <label class="check filter-check"><input name="open" type="checkbox"> Open now</label>
          </form>
          <div class="results-line"><p id="result-count" aria-live="polite">Loading providers…</p><button class="text-button" type="button" data-action="reset">Clear filters</button></div>
          <div id="providers" class="provider-grid"></div>
        </div>
      </section>
      <section id="how" class="section frame">
        <div class="section-heading"><div><p class="eyebrow">HOW IT WORKS</p><h2>From search to service</h2></div></div>
        <div class="steps">
          <article><span class="tile-icon" data-icon="search"></span><h3>Search your area</h3><p>Choose a trade and neighbourhood to see providers who work near you.</p></article>
          <article><span class="tile-icon" data-icon="sliders"></span><h3>Compare providers</h3><p>Review working hours, starting prices and service details before you decide.</p></article>
          <article><span class="tile-icon" data-icon="calendar"></span><h3>Request a visit</h3><p>Pick a preferred time and use the reference number to track your request.</p></article>
        </div>
      </section>
    </main>
    <footer class="footer"><div class="frame footer-inner">
      <div><a class="brand" href="/" aria-label="Local Service Finder home"></a><p>A private demo for Greater Noida. Provider listings and reviews are sample data.</p></div>
      <div class="footer-links"><button class="nav-text" type="button" data-action="track">Track a request</button><a href="/admin">Admin panel</a><span>Developed by Abhishek</span></div>
    </div></footer>
  </template>
  <template id="admin">
    <div class="admin-layout">
      <aside class="sidebar" id="admin-nav">
        <a class="brand" href="/" aria-label="Local Service Finder home"></a>
        <p class="sidebar-label">ADMIN PANEL</p>
        <nav aria-label="Admin navigation">
          <button data-section="overview"><span data-icon="layout"></span> Overview</button>
          <button data-section="requests"><span data-icon="clipboard"></span> Service requests</button>
          <button data-section="providers"><span data-icon="users"></span> Providers</button>
        </nav>
        <a class="back-site" href="/"><span data-icon="home"></span> Back to main site</a>
      </aside>
      <div class="admin-main">
        <header class="admin-header">
          <button class="icon-button admin-menu" type="button" data-action="admin-menu" aria-label="Open admin menu" aria-controls="admin-nav" aria-expanded="false" data-icon="menu"></button>
          <a class="brand admin-mobile-brand" href="/" aria-label="Local Service Finder home"></a>
          <span class="admin-crumb">Local Service Finder <span>/</span> <strong id="admin-crumb">Overview</strong></span>
          <span class="owner-label"><span class="owner-avatar">A</span><span><strong>Abhishek</strong><small>Site owner</small></span></span>
        </header>
        <main class="admin-content" id="main"><div id="admin-view" aria-live="polite"></div></main>
      </div>
    </div>
  </template>
</body>
</html>
